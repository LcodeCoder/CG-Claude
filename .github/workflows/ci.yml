name: Check
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run icons
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm exec electron-builder -- --dir --publish never
