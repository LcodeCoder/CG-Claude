appId: local.claude.guard
productName: CG Claude
asar: true
npmRebuild: false
# Use the prepared local runtime; avoids shell-specific CLI parsing on Windows.
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/preload.cjs
  - build/tray/**/*
  - build/icon.png
  - build/icon-mac.png
  - package.json
  - '!dist-server/**/*.map'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  artifactName: CG-Claude-${version}-macos-${arch}.${ext}
  target:
    - dir
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: CG-Claude-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: CG-Claude-${version}-windows-${arch}-portable.${ext}
linux:
  maintainer: CG Claude <LcodeCoder@users.noreply.github.com>
  artifactName: CG-Claude-${version}-linux-${arch}.${ext}
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb
